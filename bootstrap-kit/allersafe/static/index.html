<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>allersafe</title>
  <style>
    body { margin:0; padding:0; background:#06080f; color:#e8ecf4;
           font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
           min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:#111827; border:1px solid #1e293b; border-radius:16px;
            padding:32px 40px; max-width:440px; text-align:center;
            box-shadow:0 8px 32px rgba(0,0,0,0.4); }
    h1 { color:#06b6d4; margin:0 0 12px 0; font-size:28px; }
    p { color:#7b8ca8; line-height:1.6; }
    .status { display:inline-block; padding:4px 12px; border-radius:999px;
              background:rgba(34,197,94,0.1); color:#22c55e;
              border:1px solid rgba(34,197,94,0.3); font-size:13px; margin-top:8px; }
    code { background:#0c1019; padding:2px 8px; border-radius:6px;
           color:#06b6d4; font-size:13px; }
  </style>
</head>
<body>
<div class="card">
  <h1>🛡️ allersafe</h1>
  <p>서버가 정상적으로 동작 중입니다.</p>
  <div class="status" id="status">⟳ 연결 확인 중...</div>
  <p style="margin-top:20px;font-size:13px;">
    헬스체크: <code>/api/health</code><br/>
    자동배포: <code>POST /deploy</code>
  </p>
</div>
<script>
  fetch('/api/health')
    .then(r => r.json())
    .then(j => {
      document.getElementById('status').textContent =
        '● 서버 연결 — 포트 ' + j.port;
    })
    .catch(e => {
      document.getElementById('status').textContent = '✗ 연결 실패';
    });
</script>
</body>
</html>
