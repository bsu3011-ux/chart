function TopSearchBar({onResult}){
  const [query,setQuery]=useState("");
  const [sugg,setSugg]=useState([]);
  const [show,setShow]=useState(false);
  const [loading,setLoading]=useState(false);
  const debRef=useRef(null);

  const fetchSugg=useCallback((q)=>{
    clearTimeout(debRef.current);
    if(!q){setSugg([]);return;}
    debRef.current=setTimeout(async()=>{
      try{
        const r=await fetch(`${API_BASE}/api/search_stocks?q=${encodeURIComponent(q)}`);
        const j=await r.json();
        setSugg(j.results||[]);setShow(true);
      }catch(e){}
    },280);
  },[]);

  const doSearch=useCallback(async(ticker)=>{
    if(!ticker) return;
    setLoading(true);setShow(false);
    try{
      const r=await fetch(`${API_BASE}/api/stock_analysis?ticker=${encodeURIComponent(ticker)}`);
      if(!r.ok){const e=await r.json();throw new Error(e.error||'분석 실패');}
      const j=await r.json();
      onResult({type:'stock',data:j});
    }catch(e){onResult({type:'error',msg:e.message});}
    setLoading(false);
  },[onResult]);

  return(
    <div style={{position:"relative",marginBottom:10}}>
      <div style={{display:"flex",gap:8}}>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:8,
          padding:"10px 14px",borderRadius:12,
          background:C.elevated,border:`1px solid ${C.border}`}}>
          <span style={{color:C.cyan,fontSize:16}}>{loading?"⟳":"🔍"}</span>
          <input value={query}
            onChange={e=>{setQuery(e.target.value);fetchSugg(e.target.value);}}
            onFocus={()=>{if(sugg.length>0) setShow(true);fetchSugg(query);}}
            onBlur={()=>setTimeout(()=>setShow(false),180)}
            onKeyDown={e=>{if(e.key==="Enter") doSearch(query);}}
            placeholder="종목 검색: 삼성, AAPL, 테슬라, BTC..."
            style={{flex:1,background:"transparent",border:"none",color:C.text,fontSize:13,
              fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"}}/>
          {query&&<button onClick={()=>{setQuery("");setSugg([]);setShow(false);}}
            style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:14,padding:0}}>✕</button>}
        </div>
        <button onClick={()=>doSearch(query)} disabled={loading||!query} style={{
          padding:"10px 14px",borderRadius:12,
          background:query?C.cyan+"22":C.border,
          border:`1px solid ${query?C.cyan+"55":C.border}`,
          color:query?C.cyan:C.muted,fontSize:12,fontWeight:700,
          cursor:query?"pointer":"not-allowed"}}>
          {loading?<span style={{display:"inline-block",animation:"spin .7s linear infinite"}}>⟳</span>:"분석"}
        </button>
      </div>
      {show&&sugg.length>0&&(
        <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:64,
          background:C.elevated,borderRadius:12,border:`1px solid ${C.border}`,
          zIndex:200,overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,0.6)",animation:"fadeIn .15s ease"}}>
          {sugg.map((s,i)=>(
            <div key={s.ticker} onMouseDown={()=>{setQuery(s.ticker);doSearch(s.ticker);}}
              style={{display:"flex",alignItems:"center",gap:10,padding:"9px 14px",cursor:"pointer",
                borderBottom:i<sugg.length-1?`1px solid ${C.border}55`:"none",transition:"background .1s"}}
              onMouseEnter={e=>e.currentTarget.style.background=C.card}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <span style={{fontSize:18}}>{s.flag}</span>
              <div style={{flex:1}}>
                <div style={{color:C.text,fontSize:13,fontWeight:700}}>{s.name}</div>
                <div style={{color:C.muted,fontSize:10}}>{s.ticker} · {s.sector}</div>
              </div>
              <span style={{color:C.muted,fontSize:10}}>{s.name_en}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── 주식 분석 결과 카드 (축약) ──
function StockResultCard({data:d,onChart,onClose}){
  const s=SIG[d.signal_type]||SIG.NEUTRAL;
  const chg=d.change_pct>=0?C.green:C.red;
  const [btData,setBtData]=useState(null);
  const [btLoad,setBtLoad]=useState(false);
  useEffect(()=>{
    if(!d.ticker||d.data_unavailable) return;
    setBtLoad(true);
    fetch(`/api/stock_backtest?ticker=${encodeURIComponent(d.ticker)}`)
      .then(r=>r.json()).then(j=>{setBtData(j);setBtLoad(false);})
      .catch(()=>setBtLoad(false));
  },[d.ticker]);
  return(
    <div style={{borderRadius:14,border:`1px solid ${s.b}`,borderLeft:`3px solid ${s.c}`,
      background:C.cardGradient,boxShadow:s.glow,marginBottom:10,animation:"fadeIn .3s ease"}}>
      <div style={{padding:"14px 14px 10px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:24}}>{d.flag}</span>
            <div>
              <div style={{color:C.text,fontSize:15,fontWeight:800}}>{d.name||d.ticker}</div>
              <div style={{color:C.muted,fontSize:10}}>{d.ticker}{d.sector?` · ${d.sector}`:""}</div>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
            <Badge type={d.signal_type}/>
            <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:12}}>닫기 ✕</button>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:8}}>
          <span style={{color:C.text,fontSize:22,fontWeight:800}}>{fp(d.price,d.ticker)}</span>
          <span style={{color:chg,fontSize:12,fontWeight:700,padding:"2px 7px",borderRadius:5,
            background:d.change_pct>=0?C.greenBg:C.redBg}}>
            {d.change_pct>=0?"+":""}{d.change_pct?.toFixed(2)}%
          </span>
        </div>
        <Spark data={d.price_history} color={s.c} h={40}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:10}}>
          <Met label="RSI" value={d.rsi?.toFixed(1)} color={d.rsi>70?C.red:d.rsi<30?C.green:C.cyan}/>
          <Met label="MA50" value={fp(d.ma50,d.ticker)} color={d.price>d.ma50?C.green:C.red}/>
          <Met label="MA200" value={d.ma200?fp(d.ma200,d.ticker):"N/A"} color={d.ma200?(d.price>d.ma200?C.green:C.red):C.muted}/>
        </div>
        {/* 펀더멘털 */}
        {(d.pe_ratio||d.market_cap||d.high_52w)&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:6}}>
            {d.pe_ratio&&<Met label="PER" value={d.pe_ratio?.toFixed(1)+"x"} color={d.pe_ratio<15?C.green:d.pe_ratio<25?C.cyan:C.red}/>}
            {d.market_cap&&<Met label="시총" value={
              d.market_cap>=1e12?`$${(d.market_cap/1e12).toFixed(1)}T`:
              d.market_cap>=1e9?`$${(d.market_cap/1e9).toFixed(0)}B`:
              d.market_cap>=1e8?`${(d.market_cap/1e8).toFixed(0)}억`:
              `${(d.market_cap/1e4).toFixed(0)}만`
            } color={C.muted}/>}
            {d.high_52w&&<Met label="52주고점대비" value={`${d.from_high_pct?.toFixed(1)}%`} color={d.from_high_pct>-10?C.green:d.from_high_pct>-20?C.yellow:C.red}/>}
          </div>
        )}
        {/* 펀더멘털 2번째 줄 — 배당·베타·ROE·EPS성장 */}
        {(d.dividend_yield!=null||d.beta!=null||d.roe!=null||d.eps_growth!=null)&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:4,marginTop:4}}>
            {d.dividend_yield!=null&&<Met label="배당" value={`${d.dividend_yield.toFixed(2)}%`} color={d.dividend_yield>3?C.green:C.cyan}/>}
            {d.beta!=null&&<Met label="베타" value={d.beta.toFixed(2)} color={d.beta>1.5?C.red:d.beta>1?C.yellow:C.green}/>}
            {d.roe!=null&&<Met label="ROE" value={`${d.roe.toFixed(1)}%`} color={d.roe>15?C.green:d.roe>5?C.cyan:C.red}/>}
            {d.eps_growth!=null&&<Met label="EPS성장" value={`${d.eps_growth>=0?"+":""}${d.eps_growth.toFixed(0)}%`} color={d.eps_growth>10?C.green:d.eps_growth>0?C.cyan:C.red}/>}
          </div>
        )}
        {/* 신뢰도 바 */}
        {typeof d.confidence==="number"&&(
          <div style={{marginTop:8,display:"flex",alignItems:"center",gap:8}}>
            <span style={{color:C.muted,fontSize:10,minWidth:46}}>신뢰도</span>
            <div style={{flex:1,height:6,background:C.border,borderRadius:3,overflow:"hidden"}}>
              <div style={{width:`${d.confidence}%`,height:"100%",
                background:d.confidence>=80?C.green:d.confidence>=63?C.cyan:d.confidence>=41?C.yellow:C.red,
                transition:"width .3s"}}/>
            </div>
            <span style={{color:C.dim,fontSize:11,fontWeight:700,minWidth:24,textAlign:"right"}}>{d.confidence}</span>
          </div>
        )}
        {/* 다이버전스/캔들 보조 시그널 */}
        {(d.divergence||d.candle_pattern)&&(
          <div style={{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}}>
            {d.divergence==="bullish"&&<span style={{padding:"3px 7px",borderRadius:5,fontSize:10,fontWeight:700,
              background:"rgba(34,197,94,0.12)",color:C.green,border:`1px solid ${C.green}33`}}>⚡ RSI 상승 다이버전스</span>}
            {d.divergence==="bearish"&&<span style={{padding:"3px 7px",borderRadius:5,fontSize:10,fontWeight:700,
              background:"rgba(239,68,68,0.12)",color:C.red,border:`1px solid ${C.red}33`}}>⚠️ RSI 하락 다이버전스</span>}
            {d.candle_pattern&&<span style={{padding:"3px 7px",borderRadius:5,fontSize:10,fontWeight:700,
              background:`${C.cyan}12`,color:C.cyan,border:`1px solid ${C.cyan}33`}}>🕯️ {d.candle_pattern}</span>}
          </div>
        )}
        {/* ── 선행 지표 (RS / 모멘텀 / VCP) ── */}
        {(d.rs_score!=null||d.momentum||d.vcp)&&(
          <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,
            background:`${C.surface}`,border:`1px solid ${C.border}55`}}>
            <div style={{color:C.muted,fontSize:9,fontWeight:700,letterSpacing:"0.06em",marginBottom:6}}>
              🔭 선행 지표
            </div>
            {/* RS + VCP 배지 행 */}
            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>
              {d.rs_score!=null&&(()=>{
                const rs=d.rs_score;
                const col=rs>=70?C.green:rs<=30?C.red:C.yellow;
                return(
                  <span style={{padding:"3px 8px",borderRadius:5,fontSize:10,fontWeight:700,
                    background:`${col}15`,color:col,border:`1px solid ${col}33`}}>
                    💪 RS {rs.toFixed(0)} — {d.rs_label||"보통"}
                  </span>
                );
              })()}
              {d.vcp&&d.vcp.detected&&(
                <span style={{padding:"3px 8px",borderRadius:5,fontSize:10,fontWeight:700,
                  background:`${C.cyan}15`,color:C.cyan,border:`1px solid ${C.cyan}33`}}>
                  📐 VCP {d.vcp.stage}단계 · 수축 {d.vcp.tightness}%
                </span>
              )}
            </div>
            {/* 모멘텀 스코어 1M/3M/6M */}
            {d.momentum&&(()=>{
              const m=d.momentum;
              const fmtM=v=>v==null?"N/A":`${v>=0?"+":""}${v.toFixed(1)}%`;
              const colM=v=>v==null?C.muted:v>5?C.green:v>0?C.cyan:v>-5?C.yellow:C.red;
              return(
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:4}}>
                  {[
                    {label:"1개월",val:m.mom_1m},
                    {label:"3개월",val:m.mom_3m},
                    {label:"6개월",val:m.mom_6m},
                    {label:"복합점수",val:null,score:m.composite},
                  ].map(({label,val,score})=>(
                    <div key={label} style={{textAlign:"center",padding:"4px 2px",borderRadius:5,
                      background:`${C.card}`,border:`1px solid ${C.border}33`}}>
                      {score!=null?(
                        <>
                          <div style={{fontSize:11,fontWeight:800,
                            color:score>=65?C.green:score>=50?C.cyan:score>=35?C.yellow:C.red}}>
                            {score.toFixed(0)}
                          </div>
                          <div style={{color:C.muted,fontSize:8,marginTop:1}}>{label}</div>
                        </>
                      ):(
                        <>
                          <div style={{fontSize:11,fontWeight:800,color:colM(val)}}>{fmtM(val)}</div>
                          <div style={{color:C.muted,fontSize:8,marginTop:1}}>{label}</div>
                        </>
                      )}
                    </div>
                  ))}
                </div>
              );
            })()}
          </div>
        )}
        {/* ── 매크로/품질 필터 (시장환경 + 유동성 + 펀더멘털 점수) ── */}
        {(d.market_regime||d.liquidity||d.fundamental_score)&&(
          <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,
            background:`${C.surface}`,border:`1px solid ${C.border}55`}}>
            <div style={{color:C.muted,fontSize:9,fontWeight:700,letterSpacing:"0.06em",marginBottom:6}}>
              🛡️ 매크로 · 품질 필터
            </div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {/* 시장 환경 */}
              {d.market_regime&&d.market_regime.regime!=="unknown"&&(()=>{
                const r=d.market_regime;
                const adj=r.score_adj||0;
                const col=adj>0?C.green:adj<-5?C.red:adj<0?C.yellow:C.muted;
                return(
                  <span style={{padding:"3px 8px",borderRadius:5,fontSize:10,fontWeight:700,
                    background:`${col}15`,color:col,border:`1px solid ${col}33`}}
                    title={`벤치마크 ${r.bm_ticker} 기준`}>
                    {r.label} {adj>=0?"+":""}{adj}점
                  </span>
                );
              })()}
              {/* 유동성 */}
              {d.liquidity&&d.liquidity.trading_value>0&&(()=>{
                const l=d.liquidity;
                const adj=l.score_adj||0;
                const col=adj>0?C.green:adj<0?C.red:C.muted;
                return(
                  <span style={{padding:"3px 8px",borderRadius:5,fontSize:10,fontWeight:700,
                    background:`${col}15`,color:col,border:`1px solid ${col}33`}}
                    title="당일 거래대금 (주식수 × 가격)">
                    💧 거래대금 {l.trading_value_display} · {l.label} {adj>=0?"+":""}{adj}점
                  </span>
                );
              })()}
              {/* 펀더멘털 */}
              {d.fundamental_score&&d.fundamental_score.available&&(()=>{
                const f=d.fundamental_score;
                const adj=f.score_adj||0;
                const col=adj>=2?C.green:adj<=-2?C.red:C.yellow;
                return(
                  <span style={{padding:"3px 8px",borderRadius:5,fontSize:10,fontWeight:700,
                    background:`${col}15`,color:col,border:`1px solid ${col}33`}}
                    title={`PER ${f.details.per??"·"} · ROE ${f.details.roe??"·"} · EPS성장 ${f.details.eps_growth??"·"}`}>
                    🏛️ 펀더멘털 {f.label} {adj>=0?"+":""}{adj}점
                  </span>
                );
              })()}
            </div>
          </div>
        )}
        {/* ── 글로벌 매크로 오버레이 ── */}
        {d.macro_overlay&&Object.keys(d.macro_overlay.details||{}).length>0&&(()=>{
          const mo=d.macro_overlay; const det=mo.details||{};
          const adj=mo.score_adj||0;
          const col=adj>=2?C.green:adj<=-6?C.red:adj<=-3?C.yellow:C.muted;
          const badges=[
            det.vkospi!=null&&{label:`VKOSPI ${det.vkospi}`,sub:det.vkospi_label,
              col:det.vkospi<15?C.green:det.vkospi<25?C.muted:det.vkospi<35?C.yellow:C.red},
            det.tnx!=null&&{label:`금리 ${det.tnx}%`,sub:det.tnx_chg!=null?`10일 ${det.tnx_chg>0?"+":""}${det.tnx_chg}%p`:"",
              col:det.tnx_chg>0.1?C.red:det.tnx_chg<-0.1?C.green:C.muted},
            det.dxy!=null&&{label:`DXY ${det.dxy}`,sub:det.dxy_label,
              col:det.dxy_pct>0.4?C.red:det.dxy_pct<-0.4?C.green:C.muted},
            det.copper!=null&&{label:`구리 $${det.copper}`,sub:det.copper_label,
              col:det.copper_pct>0.8?C.green:det.copper_pct<-0.8?C.red:C.muted},
          ].filter(Boolean);
          return(
            <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,
              background:`${C.surface}`,border:`1px solid ${C.border}55`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{color:C.muted,fontSize:9,fontWeight:700,letterSpacing:"0.06em"}}>🌐 글로벌 매크로</span>
                <span style={{fontSize:9,fontWeight:700,color:col}}>{adj>=0?"+":""}{adj}점</span>
              </div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {badges.map((b,i)=>(
                  <span key={i} style={{padding:"3px 7px",borderRadius:5,fontSize:9,fontWeight:600,
                    background:`${b.col}15`,color:b.col,border:`1px solid ${b.col}33`}}>
                    {b.label}{b.sub?<span style={{color:C.dim,fontWeight:400}}> {b.sub}</span>:null}
                  </span>
                ))}
              </div>
            </div>
          );
        })()}
        {/* ── DART 임원 매매 (한국 종목만) ── */}
        {d.is_korean&&d.dart_insider&&(d.dart_insider.buy_count>0||d.dart_insider.sell_count>0)&&(()=>{
          const ins=d.dart_insider;
          const sig=ins.net_signal;
          const col=sig==="insider_buy"?C.green:sig==="insider_sell"?C.red:C.muted;
          const sigLabel=sig==="insider_buy"?"임원 순매수":sig==="insider_sell"?"임원 순매도":"중립";
          return(
            <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,
              background:`${col}08`,border:`1px solid ${col}33`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                <span style={{color:C.muted,fontSize:9,fontWeight:700,letterSpacing:"0.06em"}}>👥 DART 임원 매매 (60일)</span>
                <span style={{fontSize:10,fontWeight:700,color:col}}>{sigLabel}
                  {ins.score_adj!==0&&<span style={{fontSize:9,marginLeft:4}}>{ins.score_adj>0?"+":""}{ins.score_adj}점</span>}
                </span>
              </div>
              <div style={{display:"flex",gap:10}}>
                <span style={{color:C.green,fontSize:11,fontWeight:700}}>매수 {ins.buy_count}건</span>
                <span style={{color:C.red,fontSize:11,fontWeight:700}}>매도 {ins.sell_count}건</span>
              </div>
              {ins.details&&ins.details.length>0&&(
                <div style={{marginTop:5,display:"flex",flexDirection:"column",gap:2}}>
                  {ins.details.slice(0,3).map((d2,i)=>(
                    <div key={i} style={{fontSize:9,color:C.dim}}>
                      <span style={{color:d2.trade_type==="매수"?C.green:C.red,marginRight:4}}>{d2.trade_type}</span>
                      {d2.name} ({d2.role}) {d2.change>0?`${d2.change.toLocaleString()}주`:""} {d2.date}
                    </div>
                  ))}
                </div>
              )}
              {d.dart_disclosures&&d.dart_disclosures.length>0&&(
                <div style={{marginTop:5,borderTop:`1px solid ${C.border}44`,paddingTop:4}}>
                  {d.dart_disclosures.map((dc,i)=>(
                    <div key={i} style={{fontSize:9,color:C.muted,marginTop:2}}>
                      📋 {dc.title} <span style={{color:C.dim}}>{dc.date}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })()}
        {/* ── KIS 외국인·기관·체결강도 (한국 종목만) ── */}
        {d.is_korean&&(()=>{
          const inv=d.kis_investor||{};
          const trd=d.kis_trade||{};
          const hasData=Object.keys(inv).length>0||Object.keys(trd).length>0;
          if(!hasData){
            // 한국 종목인데 KIS 데이터 없음 → 키 미설정/API실패 안내
            return(
              <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,
                background:`${C.surface}`,border:`1px solid ${C.border}55`}}>
                <div style={{color:C.muted,fontSize:10,textAlign:"center",lineHeight:1.5}}>
                  🏦 KIS 수급 데이터 없음 <span style={{color:C.dim,fontSize:9}}>(키 미설정 또는 장마감 후)</span>
                </div>
              </div>
            );
          }
          const sig=inv.signal||"neutral";
          const fmtN=n=>{if(!n)return "0";const a=Math.abs(n);const s=n>0?"+":"-";return a>=10000?`${s}${(a/10000).toFixed(1)}만`:s+a.toLocaleString();};
          const cttr=trd.cttr||0;
          const cttrCol=cttr>=70?C.green:cttr>=55?C.cyan:cttr<=30?C.red:C.yellow;
          return(
            <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,
              background:`${C.surface}`,border:`1px solid ${C.border}55`}}>
              <div style={{color:C.muted,fontSize:9,fontWeight:700,letterSpacing:"0.06em",marginBottom:7}}>
                🏦 KIS 수급 분석
              </div>
              {/* 외국인·기관 순매수 */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
                {[
                  {label:"외국인 오늘",  v:inv.frgn_today},
                  {label:"외국인 3일",   v:inv.frgn_3d},
                  {label:"기관 오늘",    v:inv.inst_today},
                  {label:"기관 3일",     v:inv.inst_3d},
                ].map(({label,v})=>{
                  const col=v>0?C.green:v<0?C.red:C.muted;
                  return(
                    <div key={label} style={{padding:"5px 8px",borderRadius:6,
                      background:`${col}10`,border:`1px solid ${col}25`,textAlign:"center"}}>
                      <div style={{color:col,fontWeight:800,fontSize:11}}>{fmtN(v)}주</div>
                      <div style={{color:C.muted,fontSize:8,marginTop:1}}>{label}</div>
                    </div>
                  );
                })}
              </div>
              {/* 체결강도 + 거래량 */}
              <div style={{marginTop:4}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                  <span style={{color:C.muted,fontSize:9}}>체결강도</span>
                  {cttr>0
                    ?<span style={{color:cttrCol,fontSize:10,fontWeight:700}}>{cttr}%
                        <span style={{color:C.muted,fontWeight:400}}> ({cttr>=70?"강한 매수":cttr>=55?"매수 우위":cttr<=30?"강한 매도":cttr<=45?"매도 우위":"중립"})</span>
                      </span>
                    :<span style={{color:C.dim,fontSize:9}}>장마감</span>
                  }
                </div>
                <div style={{position:"relative",height:6,background:C.border,borderRadius:3,overflow:"hidden"}}>
                  <div style={{position:"absolute",left:0,top:0,bottom:0,
                    width:`${Math.min(cttr,100)}%`,background:cttr>0?cttrCol:C.border,borderRadius:3,transition:"width .4s"}}/>
                  <div style={{position:"absolute",left:"50%",top:0,bottom:0,
                    width:1,background:C.muted+"66"}}/>
                </div>
                {/* 거래량 */}
                {(trd.acml_vol>0||trd.prdy_vol>0)&&(
                  <div style={{display:"flex",gap:8,marginTop:5}}>
                    <span style={{color:C.dim,fontSize:9}}>당일 거래량
                      <span style={{color:C.text,marginLeft:4,fontWeight:600}}>
                        {trd.acml_vol>=10000?(trd.acml_vol/10000).toFixed(1)+"만주":trd.acml_vol?.toLocaleString()+"주"}
                      </span>
                    </span>
                    {trd.vol_vs_prev!=null&&(
                      <span style={{color:C.dim,fontSize:9}}>전일比
                        <span style={{color:trd.vol_vs_prev>=1.5?C.green:trd.vol_vs_prev<=0.5?C.red:C.muted,
                          marginLeft:4,fontWeight:600}}>
                          {(trd.vol_vs_prev*100).toFixed(0)}%
                        </span>
                      </span>
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        })()}
        {/* 진입/출구 전략 (손절·목표·R:R·포지션) */}
        {d.targets&&(()=>{
          const tgt=d.targets;
          const isLong=tgt.is_long!==false;
          // 매수: 손절 아래(-), 목표 위(+) / 매도(숏): 손절 위(+), 목표 아래(-)
          const stopLbl=isLong?`손절 -${tgt.risk_pct?.toFixed(1)}%`:`손절 ↑${tgt.risk_pct?.toFixed(1)}%`;
          const t1Pct=(tgt.t1_pct??((tgt.t1-d.price)/d.price*100));
          const t2Pct=(tgt.t2_pct??((tgt.t2-d.price)/d.price*100));
          const fmtPct=v=>isLong?`${v>=0?"+":""}${v?.toFixed(1)}%`:`↓${Math.abs(v)?.toFixed(1)}%`;
          const bdrColor=isLong?C.green:C.red;
          return(
          <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,
            background:`${bdrColor}06`,border:`1px solid ${bdrColor}22`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:isLong?6:2}}>
              <span style={{color:bdrColor,fontSize:9,fontWeight:700,letterSpacing:"0.05em"}}>
                🎯 {isLong?"매수 진입":"공매도(숏) 진입"} 전략
              </span>
              <span style={{color:tgt.rr>=3?C.green:tgt.rr>=2?C.cyan:tgt.rr>=1?C.yellow:C.red,
                fontSize:10,fontWeight:800}}>R:R {tgt.rr}:1</span>
            </div>
            {!isLong&&<div style={{color:C.muted,fontSize:8,marginBottom:5}}>
              손절↑ 가격 상승 시 손실차단 · 목표↓ 하락 시 수익실현
            </div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:5,marginBottom:6}}>
              <div style={{textAlign:"center",padding:"5px 2px",borderRadius:6,
                background:`${C.red}10`,border:`1px solid ${C.red}22`}}>
                <div style={{color:C.red,fontSize:11,fontWeight:800}}>{fp(tgt.stop,d.ticker)}</div>
                <div style={{color:C.muted,fontSize:8,marginTop:1}}>{stopLbl}</div>
              </div>
              <div style={{textAlign:"center",padding:"5px 2px",borderRadius:6,
                background:`${C.yellow}10`,border:`1px solid ${C.yellow}22`}}>
                <div style={{color:C.yellow,fontSize:11,fontWeight:800}}>{fp(tgt.t1||tgt.target,d.ticker)}</div>
                <div style={{color:C.muted,fontSize:8,marginTop:1}}>T1 {fmtPct(t1Pct)}</div>
              </div>
              <div style={{textAlign:"center",padding:"5px 2px",borderRadius:6,
                background:`${C.green}10`,border:`1px solid ${C.green}22`}}>
                <div style={{color:C.green,fontSize:11,fontWeight:800}}>{fp(tgt.t2||tgt.target,d.ticker)}</div>
                <div style={{color:C.muted,fontSize:8,marginTop:1}}>T2 {fmtPct(t2Pct)}</div>
              </div>
            </div>
            {d.position&&d.position.shares>0&&(
              <div style={{paddingTop:5,borderTop:`1px solid ${C.border}33`,
                fontSize:10,color:C.dim,lineHeight:1.5}}>
                💼 <b>1천만원 · 1% 룰</b> → 권장 <b style={{color:C.cyan}}>{d.position.shares.toLocaleString()}주</b>
                {' '}(<b>{(d.position.invest/10000).toFixed(0)}만원</b>, 최대손실 {(d.position.max_loss/10000).toFixed(0)}만원)
              </div>
            )}
          </div>
          );
        })()}
        <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,background:`${C.cyan}08`,border:`1px solid ${C.cyan}22`}}>
          <div style={{color:C.cyan,fontSize:9,fontWeight:700,marginBottom:3}}>🤖 AI 분석</div>
          {d.data_unavailable&&<div style={{color:C.yellow,fontSize:10,marginBottom:4}}>⚠️ 실시간 시세 조회 불가 — 기본 정보만 표시</div>}
          <div style={{color:C.dim,fontSize:11,lineHeight:1.6}}>{d.analysis_text}</div>
        </div>
        {/* 백테스트 성과 */}
        {!d.data_unavailable&&(
          <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,
            background:C.surface,border:`1px solid ${C.border}44`}}>
            <div style={{color:C.muted,fontSize:9,fontWeight:700,
              letterSpacing:"0.06em",marginBottom:6}}>
              📈 백테스트 성과{btData&&!btData.error?` (${btData.years?.toFixed(0)}년)`:""}
            </div>
            {btLoad&&<div style={{color:C.dim,fontSize:11,padding:"4px 0"}}>계산 중... (최초 1회, 이후 7일 캐시)</div>}
            {!btLoad&&!btData&&<div style={{color:C.dim,fontSize:11}}>로딩 중...</div>}
            {btData&&btData.error&&<div style={{color:C.red,fontSize:11}}>{btData.error}</div>}
            {btData&&!btData.error&&(()=>{
              const alpha=btData.cagr-btData.cagr_bh;
              return(<>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4,marginBottom:8}}>
                  {[
                    {label:"연평균(CAGR)",val:`${btData.cagr>0?"+":""}${btData.cagr}%`,
                      color:btData.cagr>8?C.green:btData.cagr>0?C.cyan:C.red},
                    {label:"최대낙폭(MDD)",val:`-${btData.mdd}%`,
                      color:btData.mdd<15?C.green:btData.mdd<30?C.yellow:C.red},
                    {label:"Sharpe",val:`${btData.sharpe}`,
                      color:btData.sharpe>1?C.green:btData.sharpe>0.5?C.cyan:C.muted},
                  ].map((item,i)=>(
                    <div key={i} style={{textAlign:"center",padding:"5px 2px",borderRadius:6,
                      background:C.card,border:`1px solid ${C.border}33`}}>
                      <div style={{color:item.color,fontSize:14,fontWeight:800,
                        fontVariantNumeric:"tabular-nums"}}>{item.val}</div>
                      <div style={{color:C.muted,fontSize:8,marginTop:2}}>{item.label}</div>
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                  padding:"5px 6px",borderRadius:6,
                  background:alpha>0?`${C.green}10`:`${C.red}10`,
                  border:`1px solid ${alpha>0?C.green:C.red}22`}}>
                  <span style={{color:C.muted,fontSize:10}}>vs 단순보유 ({btData.cagr_bh}%/년)</span>
                  <span style={{color:alpha>0?C.green:C.red,fontSize:11,fontWeight:700}}>
                    {alpha>0?"+":""}{alpha.toFixed(1)}% 초과수익
                  </span>
                </div>
                {btData.yearly&&Object.keys(btData.yearly).length>0&&(
                  <div style={{marginTop:6,display:"flex",gap:4,flexWrap:"wrap"}}>
                    {Object.entries(btData.yearly).sort((a,b)=>b[0]-a[0]).map(([yr,ret])=>(
                      <div key={yr} style={{textAlign:"center",padding:"3px 6px",borderRadius:5,
                        background:`${ret>=0?C.green:C.red}14`,
                        border:`1px solid ${ret>=0?C.green:C.red}22`}}>
                        <div style={{color:ret>=0?C.green:C.red,fontSize:11,fontWeight:700}}>
                          {ret>=0?"+":""}{ret}%</div>
                        <div style={{color:C.muted,fontSize:8}}>{yr}</div>
                      </div>
                    ))}
                  </div>
                )}
              </>);
            })()}
          </div>
        )}
        <button onClick={()=>onChart({ticker:d.ticker,name:d.name,flag:d.flag,strategy_name:d.signal_text})}
          style={{width:"100%",marginTop:8,padding:"8px",borderRadius:10,
            border:`1px solid ${C.cyan}44`,background:C.cyan+"12",
            color:C.cyan,fontSize:12,fontWeight:700,cursor:"pointer"}}>
          📊 캔들차트 보기
        </button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════
// 스크리너 페이지
// ════════════════════════════════════════════
// ════════════════════════════════════════════
// 🏆 종목 랭킹 페이지
// ════════════════════════════════════════════
function RankingPage(){
  const [data,setData]=React.useState(null);
  const [loading,setLoading]=React.useState(true);
  const [sigFilter,setSigFilter]=React.useState("all");
  const [polling,setPolling]=React.useState(false);
  const [selectedTicker,setSelectedTicker]=React.useState(null);
  const [analysisData,setAnalysisData]=React.useState(null);
  const [analysisLoading,setAnalysisLoading]=React.useState(false);

  const openAnalysis=async(ticker)=>{
    setSelectedTicker(ticker);
    setAnalysisData(null);
    setAnalysisLoading(true);
    try{
      const r=await fetch(`${API_BASE}/api/stock_analysis?ticker=${encodeURIComponent(ticker)}`);
      const j=await r.json();
      setAnalysisData(j);
    }catch(e){}
    setAnalysisLoading(false);
  };

  const fetchRanking=(refresh=false)=>{
    setLoading(true);
    fetch(`/api/top_stocks?n=50${refresh?"&refresh=1":""}`)
      .then(r=>r.json())
      .then(d=>{
        setData(d);
        setLoading(false);
        if(d.status==="analyzing"){
          setPolling(true);
        } else {
          setPolling(false);
        }
      })
      .catch(()=>setLoading(false));
  };

  React.useEffect(()=>{fetchRanking();},[]);

  // 분석 중일 때 15초마다 폴링
  React.useEffect(()=>{
    if(!polling) return;
    const id=setInterval(()=>{
      fetch("/api/top_stocks?n=50")
        .then(r=>r.json())
        .then(d=>{
          setData(d);
          if(d.status==="ok"){setPolling(false);}
        }).catch(()=>{});
    },15000);
    return ()=>clearInterval(id);
  },[polling]);

  const medals=["🥇","🥈","🥉"];
  const sigColor=s=>s&&s.includes("BUY")?C.green:s&&s.includes("SELL")?C.red:C.muted;

  const ranking=(data?.ranking||[]).filter(r=>{
    if(sigFilter==="buy")  return r.signal_type&&r.signal_type.includes("BUY");
    if(sigFilter==="sell") return r.signal_type&&r.signal_type.includes("SELL");
    return true;
  });

  const fp=(v,ticker)=>{
    if(v==null) return "-";
    const isKR=ticker&&(ticker.endsWith(".KS")||ticker.endsWith(".KQ"));
    if(isKR) return Math.round(v).toLocaleString()+"원";
    return "$"+v.toFixed(2);
  };

  return(
    <div style={{paddingBottom:80}}>
      {/* 종목 분석 모달 */}
      {selectedTicker&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setSelectedTicker(null);}}
          style={{position:"fixed",inset:0,zIndex:500,background:"rgba(0,0,0,0.75)",
            backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",
            display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{width:"100%",maxWidth:520,maxHeight:"90vh",overflowY:"auto",
            borderRadius:"20px 20px 0 0",background:C.surface,
            border:`1px solid ${C.border}`,padding:"16px 14px 32px",
            animation:"slideUp .25s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{color:C.muted,fontSize:11}}>{selectedTicker}</div>
              <button onClick={()=>setSelectedTicker(null)} style={{background:"none",border:"none",
                color:C.muted,fontSize:18,cursor:"pointer",padding:"0 4px"}}>✕</button>
            </div>
            {analysisLoading&&(
              <div style={{textAlign:"center",padding:"40px 0",color:C.cyan}}>
                <div style={{fontSize:28,marginBottom:8,animation:"spin .7s linear infinite"}}>⟳</div>
                <div style={{fontSize:12}}>분석 중...</div>
              </div>
            )}
            {!analysisLoading&&analysisData&&!analysisData.error&&(
              <StockResultCard data={analysisData} onChart={()=>{}} onClose={()=>setSelectedTicker(null)}/>
            )}
            {!analysisLoading&&analysisData?.error&&(
              <div style={{color:C.red,textAlign:"center",padding:20,fontSize:13}}>{analysisData.error}</div>
            )}
          </div>
        </div>
      )}

      {/* 헤더 */}
      <div style={{padding:"16px 16px 8px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{color:C.text,fontSize:18,fontWeight:900}}>🏆 종목 랭킹</div>
          {data?.updated&&<div style={{color:C.muted,fontSize:10,marginTop:2}}>
            기준: {new Date(data.updated).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}
            {" · "}{data.total_analyzed||0}개 분석
            {data.analyzing&&" · 갱신 중..."}
          </div>}
        </div>
        <button onClick={()=>fetchRanking(true)} style={{
          padding:"6px 12px",borderRadius:8,border:`1px solid ${C.cyan}44`,
          background:`${C.cyan}12`,color:C.cyan,fontSize:11,fontWeight:700,cursor:"pointer"}}>
          🔄 새로고침
        </button>
      </div>

      {/* 필터 탭 */}
      <div style={{display:"flex",gap:6,padding:"0 16px 10px"}}>
        {[["all","전체"],["buy","매수"],["sell","매도"]].map(([v,l])=>(
          <button key={v} onClick={()=>setSigFilter(v)} style={{
            padding:"5px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,
            background:sigFilter===v?C.cyan:C.card,
            color:sigFilter===v?"#000":C.dim}}>
            {l}
          </button>
        ))}
      </div>

      {/* 분석 중 */}
      {data?.status==="analyzing"&&(
        <div style={{margin:"40px 16px",textAlign:"center",color:C.muted}}>
          <div style={{fontSize:32,marginBottom:12}}>⏳</div>
          <div style={{fontSize:14,fontWeight:700,color:C.cyan,marginBottom:6}}>종목 분석 중...</div>
          <div style={{fontSize:11}}>{data.message}</div>
          <div style={{fontSize:10,marginTop:8,color:C.muted}}>15초마다 자동 갱신됩니다</div>
        </div>
      )}

      {/* 로딩 */}
      {loading&&data===null&&(
        <div style={{textAlign:"center",padding:40,color:C.muted,fontSize:13}}>불러오는 중...</div>
      )}

      {/* 랭킹 카드 */}
      {ranking.map((r,i)=>{
        const conf=r.confidence||0;
        const confCol=conf>=80?C.green:conf>=63?C.cyan:conf>=41?C.yellow:C.red;
        const chgCol=(r.change_pct||0)>=0?C.green:C.red;
        const rsCol=(r.rs_score||50)>=70?C.green:(r.rs_score||50)<=30?C.red:C.yellow;
        return(
          <div key={r.ticker} onClick={()=>openAnalysis(r.ticker)} style={{
            margin:"0 12px 10px",padding:"12px 14px",borderRadius:12,
            background:C.card,border:`1px solid ${i<3?confCol+"44":C.border+"33"}`,
            position:"relative",cursor:"pointer",transition:"background .15s"}}
            onMouseEnter={e=>e.currentTarget.style.background=C.elevated}
            onMouseLeave={e=>e.currentTarget.style.background=C.card}>

            {/* 순위 + 종목명 */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <span style={{fontSize:i<3?22:14,fontWeight:900,minWidth:28,textAlign:"center",
                color:i<3?confCol:C.muted}}>
                {i<3?medals[i]:`#${i+1}`}
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  <span style={{fontSize:13}}>{r.flag}</span>
                  <span style={{color:C.text,fontWeight:800,fontSize:13,
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</span>
                  <span style={{color:C.muted,fontSize:9}}>{r.sector}</span>
                </div>
                <div style={{color:C.dim,fontSize:9,marginTop:1}}>{r.ticker}</div>
              </div>
              {/* 신호 배지 */}
              <span style={{padding:"3px 8px",borderRadius:6,fontSize:10,fontWeight:800,
                background:`${sigColor(r.signal_type)}18`,color:sigColor(r.signal_type),
                border:`1px solid ${sigColor(r.signal_type)}33`,whiteSpace:"nowrap"}}>
                {r.signal_text||r.signal_type}
              </span>
            </div>

            {/* 가격 + 신뢰도 */}
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"baseline",gap:6}}>
                  <span style={{color:C.text,fontWeight:800,fontSize:14}}>{fp(r.price,r.ticker)}</span>
                  <span style={{color:chgCol,fontSize:11,fontWeight:700}}>
                    {(r.change_pct>=0?"+":"")+r.change_pct?.toFixed(2)+"%"}
                  </span>
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{color:confCol,fontSize:16,fontWeight:900}}>{conf}</div>
                <div style={{color:C.muted,fontSize:8}}>신뢰도</div>
              </div>
            </div>

            {/* 신뢰도 바 */}
            <div style={{height:4,background:C.border,borderRadius:2,overflow:"hidden",marginBottom:8}}>
              <div style={{width:`${conf}%`,height:"100%",background:confCol,borderRadius:2,
                transition:"width .4s"}}/>
            </div>

            {/* RS + 모멘텀 */}
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {r.rs_score!=null&&(
                <span style={{padding:"2px 7px",borderRadius:4,fontSize:9,fontWeight:700,
                  background:`${rsCol}15`,color:rsCol,border:`1px solid ${rsCol}22`}}>
                  RS {r.rs_score?.toFixed(0)}
                </span>
              )}
              {r.mom_1m!=null&&(
                <span style={{padding:"2px 7px",borderRadius:4,fontSize:9,fontWeight:700,
                  background:`${r.mom_1m>=0?C.green:C.red}12`,
                  color:r.mom_1m>=0?C.green:C.red}}>
                  1M {r.mom_1m>=0?"+":""}{r.mom_1m?.toFixed(1)}%
                </span>
              )}
              {r.mom_3m!=null&&(
                <span style={{padding:"2px 7px",borderRadius:4,fontSize:9,fontWeight:700,
                  background:`${r.mom_3m>=0?C.green:C.red}12`,
                  color:r.mom_3m>=0?C.green:C.red}}>
                  3M {r.mom_3m>=0?"+":""}{r.mom_3m?.toFixed(1)}%
                </span>
              )}
              {r.mom_6m!=null&&(
                <span style={{padding:"2px 7px",borderRadius:4,fontSize:9,fontWeight:700,
                  background:`${r.mom_6m>=0?C.green:C.red}12`,
                  color:r.mom_6m>=0?C.green:C.red}}>
                  6M {r.mom_6m>=0?"+":""}{r.mom_6m?.toFixed(1)}%
                </span>
              )}
              {r.regime_label&&r.regime_label!=="데이터 부족"&&(
                <span style={{padding:"2px 7px",borderRadius:4,fontSize:9,
                  color:C.muted,background:C.surface,border:`1px solid ${C.border}33`}}>
                  {r.regime_label}
                </span>
              )}
              {r.fundamental_label&&r.fundamental_adj!=null&&r.fundamental_adj!==0&&(
                <span style={{padding:"2px 7px",borderRadius:4,fontSize:9,
                  color:r.fundamental_adj>=2?C.green:r.fundamental_adj<=-2?C.red:C.muted,
                  background:C.surface,border:`1px solid ${C.border}33`}}>
                  {r.fundamental_label}
                </span>
              )}
            </div>
          </div>
        );
      })}

      {data?.status==="ok"&&ranking.length===0&&(
        <div style={{textAlign:"center",padding:40,color:C.muted,fontSize:13}}>
          해당 조건의 종목이 없습니다
        </div>
      )}
    </div>
  );
}

function ScreenerPage({markets,onChart}){
  const [sigFilter,setSigFilter]=useState("all");
  const [stratFilter,setStratFilter]=useState("all");
  const [sortBy,setSortBy]=useState("change");
  const [rsiMin,setRsiMin]=useState(0);
  const [rsiMax,setRsiMax]=useState(100);

  const filtered=useMemo(()=>{
    let ms=[...markets];
    if(sigFilter==="buy") ms=ms.filter(m=>["BUY","LEVERAGE_2X","INVESTED","STRONG_BUY"].includes(m.signal_type));
    else if(sigFilter==="sell") ms=ms.filter(m=>["SELL","CASH","CASH_VOL","STRONG_SELL"].includes(m.signal_type));
    else if(sigFilter==="hold") ms=ms.filter(m=>["HOLD_1X","NEUTRAL","CAUTION"].includes(m.signal_type));
    if(stratFilter!=="all") ms=ms.filter(m=>m.strategy===stratFilter);
    ms=ms.filter(m=>(m.rsi||50)>=rsiMin&&(m.rsi||50)<=rsiMax);
    if(sortBy==="change") ms.sort((a,b)=>b.change_pct-a.change_pct);
    else if(sortBy==="rsi") ms.sort((a,b)=>b.rsi-a.rsi);
    else if(sortBy==="from_high") ms.sort((a,b)=>b.from_high_pct-a.from_high_pct);
    return ms;
  },[markets,sigFilter,stratFilter,sortBy,rsiMin,rsiMax]);

  const btnSt=(val,cur)=>({
    padding:"5px 10px",borderRadius:8,fontSize:10,fontWeight:700,cursor:"pointer",
    border:`1px solid ${cur===val?C.cyan+"55":C.border}`,
    background:cur===val?C.cyan+"18":"transparent",
    color:cur===val?C.cyan:C.muted,
  });

  return(
    <div className="tab-content">
      <div style={{color:C.text,fontSize:15,fontWeight:800,marginBottom:12}}>🔍 스크리너</div>
      {/* 필터 */}
      <div style={{padding:"12px",borderRadius:12,background:C.surface,border:`1px solid ${C.border}`,marginBottom:10}}>
        <div style={{marginBottom:10}}>
          <div style={{color:C.dim,fontSize:9,fontWeight:700,marginBottom:6}}>시그널</div>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {[["all","전체"],["buy","매수"],["sell","매도"],["hold","관망"]].map(([v,l])=>(
              <button key={v} onClick={()=>setSigFilter(v)} style={btnSt(v,sigFilter)}>{l}</button>
            ))}
          </div>
        </div>
        <div style={{marginBottom:10}}>
          <div style={{color:C.dim,fontSize:9,fontWeight:700,marginBottom:6}}>전략</div>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {[["all","전체"],["minervini","미너비니"],["leverage","레버리지"],["dual_filter","이중필터"],["risk_defense","위기방어"]].map(([v,l])=>(
              <button key={v} onClick={()=>setStratFilter(v)} style={btnSt(v,stratFilter)}>{l}</button>
            ))}
          </div>
        </div>
        <div style={{marginBottom:8}}>
          <div style={{color:C.dim,fontSize:9,fontWeight:700,marginBottom:6}}>RSI 범위: {rsiMin} ~ {rsiMax}</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input type="range" min="0" max="100" value={rsiMin} onChange={e=>setRsiMin(+e.target.value)}
              style={{flex:1,accentColor:C.cyan}}/>
            <input type="range" min="0" max="100" value={rsiMax} onChange={e=>setRsiMax(+e.target.value)}
              style={{flex:1,accentColor:C.cyan}}/>
          </div>
        </div>
        <div>
          <div style={{color:C.dim,fontSize:9,fontWeight:700,marginBottom:6}}>정렬</div>
          <div style={{display:"flex",gap:4}}>
            {[["change","변동%"],["rsi","RSI"],["from_high","고점대비"]].map(([v,l])=>(
              <button key={v} onClick={()=>setSortBy(v)} style={btnSt(v,sortBy)}>{l}</button>
            ))}
          </div>
        </div>
      </div>

      <div style={{color:C.muted,fontSize:10,marginBottom:8}}>{filtered.length}개 종목</div>

      {filtered.map(m=>{
        const s=SIG[m.signal_type]||SIG.NEUTRAL;
        const chg=m.change_pct>=0?C.green:C.red;
        return(
          <div key={m.ticker} style={{display:"flex",alignItems:"center",gap:10,
            padding:"10px 12px",borderRadius:10,marginBottom:6,
            background:C.cardGradient,border:`1px solid ${C.border}`,
            borderLeft:`3px solid ${s.c}`}}>
            <span style={{fontSize:20}}>{m.flag}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{color:C.text,fontSize:12,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{m.name}</div>
              <div style={{color:C.muted,fontSize:9}}>{m.ticker}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{color:chg,fontSize:11,fontWeight:700}}>{m.change_pct>=0?"+":""}{m.change_pct?.toFixed(2)}%</div>
              <div style={{color:C.muted,fontSize:9}}>RSI {m.rsi?.toFixed(0)}</div>
            </div>
            <Badge type={m.signal_type}/>
            <button onClick={()=>onChart(m)} style={{background:C.cyan+"18",border:`1px solid ${C.cyan}44`,
              color:C.cyan,fontSize:10,padding:"4px 8px",borderRadius:7,cursor:"pointer",flexShrink:0}}>차트</button>
          </div>
        );
      })}
      {!filtered.length&&<div style={{textAlign:"center",color:C.muted,padding:30,fontSize:13}}>
        조건에 맞는 종목이 없습니다
      </div>}
    </div>
  );
}

// ════════════════════════════════════════════
// 보유종목 모니터 (포트폴리오 페이지)
// ════════════════════════════════════════════
function PortfolioPage(){
  const LS_KEY="trading_bot_portfolio";
  const [holdings,setHoldings]=useState(()=>{
    try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]");}catch(e){return [];}
  });
  const [prices,setPrices]=useState({});
  const [analyses,setAnalyses]=useState({});
  const [srvStatus,setSrvStatus]=useState({});
  const [mktSignals,setMktSignals]=useState([]);
  const [form,setForm]=useState({ticker:"",name:"",quantity:"",buyPrice:""});
  const [adding,setAdding]=useState(false);
  const [searching,setSearching]=useState(false);
  const [sugg,setSugg]=useState([]);
  const [fetching,setFetching]=useState(false);
  const [analyzing,setAnalyzing]=useState(false);
  const debRef=useRef(null);

  useEffect(()=>{localStorage.setItem(LS_KEY,JSON.stringify(holdings));},[holdings]);

  // 서버 상태 + 시장 컨텍스트
  useEffect(()=>{
    fetch(`${API_BASE}/api/status`).then(r=>r.json()).then(setSrvStatus).catch(()=>{});
    fetch(`${API_BASE}/api/signals`).then(r=>r.json()).then(d=>setMktSignals(d.signals||[])).catch(()=>{});
  },[]);

  // 현재가 조회
  const fetchPrices=useCallback(async()=>{
    if(!holdings.length) return;
    setFetching(true);
    const updated={};
    await Promise.all(holdings.map(async h=>{
      try{
        const r=await fetch(`${API_BASE}/api/chart?ticker=${encodeURIComponent(h.ticker)}&interval=1d`);
        const d=await r.json();
        const c=d.candles||[];
        if(c.length) updated[h.ticker]=c[c.length-1].close;
      }catch(e){}
    }));
    setPrices(updated);setFetching(false);
  },[holdings]);

  // 전체 분석 (시그널 + DART)
  const analyzeAll=useCallback(async()=>{
    if(!holdings.length) return;
    setAnalyzing(true);
    const result={};
    await Promise.all(holdings.map(async h=>{
      try{
        const r=await fetch(`${API_BASE}/api/stock_analysis?ticker=${encodeURIComponent(h.ticker)}`);
        const d=await r.json();
        if(!d.error) result[h.ticker]=d;
      }catch(e){}
    }));
    setAnalyses(result);setAnalyzing(false);
  },[holdings]);

  useEffect(()=>{fetchPrices();analyzeAll();},[]);

  // 검색 자동완성
  const fetchSugg=useCallback((q)=>{
    clearTimeout(debRef.current);
    if(!q){setSugg([]);return;}
    debRef.current=setTimeout(async()=>{
      try{
        const r=await fetch(`${API_BASE}/api/search_stocks?q=${encodeURIComponent(q)}`);
        const j=await r.json();setSugg(j.results||[]);setSearching(true);
      }catch(e){}
    },280);
  },[]);

  const addHolding=()=>{
    if(!form.ticker||!form.quantity||!form.buyPrice) return;
    setHoldings(p=>[...p,{ticker:form.ticker,name:form.name||form.ticker,
      quantity:parseFloat(form.quantity),buyPrice:parseFloat(form.buyPrice),
      addedAt:new Date().toISOString()}]);
    setForm({ticker:"",name:"",quantity:"",buyPrice:""});
    setAdding(false);setSugg([]);
  };
  const removeHolding=(idx)=>setHoldings(p=>p.filter((_,i)=>i!==idx));

  // 집계
  const totalBuy=holdings.reduce((a,h)=>a+h.buyPrice*h.quantity,0);
  const totalNow=holdings.reduce((a,h)=>a+(prices[h.ticker]||h.buyPrice)*h.quantity,0);
  const totalPnlPct=totalBuy>0?((totalNow-totalBuy)/totalBuy*100):0;
  const sellSignals=holdings.filter(h=>["SELL","STRONG_SELL","CASH","CASH_VOL"].includes(analyses[h.ticker]?.signal_type));

  // 시장 컨텍스트
  const ks11=mktSignals.find(s=>s.ticker==='^KS11');
  const kq11=mktSignals.find(s=>s.ticker==='^KQ11');
  const sp=mktSignals.find(s=>s.ticker==='^GSPC');
  const mktChg=ks11?.change_pct??null;
  const mktLabel=mktChg==null?null:mktChg>=2?"급등":mktChg>=0.5?"상승":mktChg>=-0.5?"보합":mktChg>=-2?"하락":"급락";

  // 시그널 헬퍼
  const sigColor=st=>({BUY:"#26a69a",STRONG_BUY:"#00e676",INVESTED:"#26a69a",HOLD_1X:"#42a5f5",
    SELL:"#ef5350",STRONG_SELL:"#b71c1c",CASH:"#ef5350",CASH_VOL:"#ef5350",
    NEUTRAL:"#78909c",CAUTION:"#ffa726",LEVERAGE_2X:"#00e676"}[st]||C.muted);
  const sigLabel=st=>({BUY:"매수",STRONG_BUY:"강력매수",INVESTED:"보유",HOLD_1X:"보유",
    SELL:"매도",STRONG_SELL:"강력매도",CASH:"현금전환",CASH_VOL:"현금전환",
    NEUTRAL:"관망",CAUTION:"주의",LEVERAGE_2X:"2x레버리지"}[st]||st);

  const fmtPrc=(v,ticker)=>{
    if(v==null||v===0) return "-";
    const isKr=ticker&&(ticker.endsWith(".KS")||ticker.endsWith(".KQ"));
    return isKr?v.toLocaleString("ko-KR",{maximumFractionDigits:0})+"원":"$"+v.toLocaleString("en-US",{maximumFractionDigits:2});
  };

  return(
    <div className="tab-content">

      {/* 헤더 */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <div style={{color:C.text,fontSize:15,fontWeight:800}}>📋 보유종목 모니터</div>
        <div style={{display:"flex",gap:5}}>
          <button onClick={analyzeAll} disabled={analyzing||!holdings.length}
            style={{padding:"5px 9px",borderRadius:7,fontSize:10,fontWeight:700,cursor:"pointer",
              border:`1px solid ${C.cyan}44`,background:C.cyan+"14",color:C.cyan}}>
            {analyzing?"⟳":"📢"} 공시
          </button>
          <button onClick={()=>{fetchPrices();analyzeAll();}} disabled={fetching||analyzing}
            style={{padding:"5px 9px",borderRadius:7,fontSize:10,fontWeight:700,cursor:"pointer",
              border:`1px solid ${C.border}`,background:C.surface,color:C.dim}}>
            🔄 점검
          </button>
          <button onClick={()=>setAdding(!adding)}
            style={{padding:"5px 9px",borderRadius:7,fontSize:10,fontWeight:700,cursor:"pointer",
              border:`1px solid ${C.green}44`,background:C.green+"14",color:C.green}}>
            {adding?"✕":"+"} {adding?"취소":"추가"}
          </button>
        </div>
      </div>

      {/* API 상태 배지 */}
      <div style={{display:"flex",gap:5,marginBottom:10,flexWrap:"wrap"}}>
        {[
          {ok:srvStatus.dart_available,label:"DART API"},
          {ok:srvStatus.kis_available, label:"KIS API"},
        ].map(({ok,label})=>(
          <span key={label} style={{padding:"3px 8px",borderRadius:5,fontSize:9,fontWeight:700,
            background:ok?C.green+"1a":"#ef535018",color:ok?C.green:"#ef5350",
            border:`1px solid ${ok?C.green+"44":"#ef535033"}`}}>
            {ok?"✓":"✗"} {label} {ok?"연결됨":label==="DART API"?"미설정 (.env에 추가 필요)":"미설정"}
          </span>
        ))}
      </div>

      {/* 시장 컨텍스트 바 */}
      {mktLabel&&(
        <div style={{padding:"8px 12px",borderRadius:10,marginBottom:10,
          background:mktChg>=0?C.green+"14":C.red+"14",
          border:`1px solid ${mktChg>=0?C.green+"44":C.red+"44"}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:mktChg>=0?C.green:C.red,fontSize:11,fontWeight:800}}>
              시장 {mktLabel} ({mktChg>=0?"+":""}{mktChg?.toFixed(1)}%)
            </span>
            <span style={{color:C.muted,fontSize:9}}>
              KOSPI {ks11?.change_pct>=0?"+":""}{ks11?.change_pct?.toFixed(1)}%
              {kq11&&` · KOSDAQ ${kq11.change_pct>=0?"+":""}{kq11.change_pct?.toFixed(1)}%`}
              {sp&&` · S&P ${sp.change_pct>=0?"+":""}{sp.change_pct?.toFixed(1)}%`}
            </span>
          </div>
        </div>
      )}

      {/* 요약 3칸 */}
      {holdings.length>0&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
          {[
            {label:"보유 종목",val:`${holdings.length}개`,color:C.text},
            {label:"총 수익률",val:`${totalPnlPct>=0?"+":""}${totalPnlPct.toFixed(2)}%`,color:totalPnlPct>=0?C.green:C.red},
            {label:"매도신호",val:`${sellSignals.length}개`,color:sellSignals.length>0?C.red:C.muted},
          ].map(({label,val,color})=>(
            <div key={label} style={{padding:"10px",borderRadius:10,textAlign:"center",
              background:C.cardGradient,border:`1px solid ${C.border}`}}>
              <div style={{color:C.muted,fontSize:8,marginBottom:2}}>{label}</div>
              <div style={{color,fontSize:14,fontWeight:800}}>{val}</div>
            </div>
          ))}
        </div>
      )}

      {/* 매도 신호 알림 박스 */}
      {sellSignals.length>0&&(
        <div style={{padding:"10px 12px",borderRadius:10,marginBottom:10,
          background:"#ef535010",border:"1px solid #ef535033"}}>
          <div style={{color:"#ef5350",fontSize:10,fontWeight:800,marginBottom:6}}>
            🚨 매도 신호 {sellSignals.length}개
          </div>
          {sellSignals.map((h,i)=>{
            const a=analyses[h.ticker];
            return(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                padding:"4px 0",borderTop:i>0?"1px solid #ef535018":undefined}}>
                <span style={{color:C.text,fontSize:11,fontWeight:700}}>
                  {h.name}<span style={{color:C.muted,fontSize:9,marginLeft:5}}>{h.ticker}</span>
                </span>
                <span style={{padding:"2px 8px",borderRadius:4,fontSize:9,fontWeight:700,
                  background:"#ef535020",color:"#ef5350"}}>
                  {a?sigLabel(a.signal_type):"매도"} · 신뢰도 {a?.confidence??"-"}
                </span>
              </div>
            );
          })}
        </div>
      )}

      {/* 종목 추가 폼 */}
      {adding&&(
        <div style={{padding:"12px",borderRadius:12,background:C.surface,
          border:`1px solid ${C.border}`,marginBottom:10,position:"relative"}}>
          <div style={{color:C.dim,fontSize:11,fontWeight:700,marginBottom:8}}>종목 추가</div>
          <div style={{position:"relative",marginBottom:8}}>
            <input value={form.ticker}
              onChange={e=>{setForm(p=>({...p,ticker:e.target.value,name:""}));fetchSugg(e.target.value);}}
              onBlur={()=>setTimeout(()=>setSearching(false),150)}
              placeholder="티커 또는 종목명 (예: AAPL, 삼성전자)"
              style={{width:"100%",padding:"9px 12px",borderRadius:8,boxSizing:"border-box",
                background:C.elevated,border:`1px solid ${C.border}`,color:C.text,fontSize:13}}/>
            {searching&&sugg.length>0&&(
              <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,
                background:C.elevated,borderRadius:8,border:`1px solid ${C.border}`,zIndex:50,overflow:"hidden"}}>
                {sugg.slice(0,6).map((s,i)=>(
                  <div key={s.ticker} onMouseDown={()=>{setForm(p=>({...p,ticker:s.ticker,name:s.name}));setSearching(false);setSugg([]);}}
                    style={{display:"flex",gap:8,padding:"8px 12px",cursor:"pointer",
                      borderBottom:i<5?`1px solid ${C.border}44`:"none"}}
                    onMouseEnter={e=>e.currentTarget.style.background=C.card}
                    onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <span>{s.flag}</span>
                    <div style={{flex:1}}>
                      <div style={{color:C.text,fontSize:12,fontWeight:600}}>{s.name}</div>
                      <div style={{color:C.muted,fontSize:10}}>{s.ticker}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <input value={form.quantity} onChange={e=>setForm(p=>({...p,quantity:e.target.value}))}
              placeholder="수량" type="number" min="0"
              style={{padding:"9px 12px",borderRadius:8,background:C.elevated,
                border:`1px solid ${C.border}`,color:C.text,fontSize:13}}/>
            <input value={form.buyPrice} onChange={e=>setForm(p=>({...p,buyPrice:e.target.value}))}
              placeholder="매수가" type="number" min="0"
              style={{padding:"9px 12px",borderRadius:8,background:C.elevated,
                border:`1px solid ${C.border}`,color:C.text,fontSize:13}}/>
          </div>
          <button onClick={addHolding} disabled={!form.ticker||!form.quantity||!form.buyPrice}
            style={{width:"100%",padding:"9px",borderRadius:8,
              background:C.green+"22",border:`1px solid ${C.green}44`,
              color:C.green,fontSize:12,fontWeight:700,cursor:"pointer"}}>
            ✅ 추가
          </button>
        </div>
      )}

      {/* 빈 상태 */}
      {holdings.length===0&&!adding&&(
        <div style={{textAlign:"center",padding:48,color:C.muted,fontSize:13}}>
          <div style={{fontSize:32,marginBottom:8}}>📋</div>
          <div>보유 종목이 없습니다</div>
          <div style={{fontSize:11,marginTop:4}}>+ 추가 버튼으로 시작하세요</div>
        </div>
      )}

      {/* 보유 종목 카드 */}
      {holdings.map((h,i)=>{
        const cur=prices[h.ticker]||null;
        const pnlPct=cur?(cur-h.buyPrice)/h.buyPrice*100:null;
        const a=analyses[h.ticker];
        const sc=a?sigColor(a.signal_type):null;
        const borderCol=sc||(pnlPct!=null?(pnlPct>=0?C.green:C.red):C.border);
        return(
          <div key={i} style={{padding:"12px",borderRadius:12,marginBottom:8,
            background:C.cardGradient,border:`1px solid ${borderCol}33`,
            borderLeft:`3px solid ${borderCol}`}}>

            {/* 상단: 종목명 + 시그널 배지 */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{color:C.text,fontSize:13,fontWeight:700}}>{h.name}</span>
                  {a?(
                    <span style={{padding:"2px 7px",borderRadius:4,fontSize:9,fontWeight:700,
                      background:sc+"22",color:sc,flexShrink:0}}>
                      {sigLabel(a.signal_type)}
                    </span>
                  ):analyzing&&(
                    <span style={{color:C.muted,fontSize:9}}>분석 중…</span>
                  )}
                </div>
                <div style={{color:C.muted,fontSize:10,marginTop:2}}>
                  {h.ticker} · {h.quantity.toLocaleString()}주 · 매수가 {fmtPrc(h.buyPrice,h.ticker)}
                </div>
              </div>
              <button onClick={()=>removeHolding(i)}
                style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:14,padding:"0 0 0 8px"}}>🗑</button>
            </div>

            {/* 가격 그리드 */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:8}}>
              {[
                {label:"현재가",val:cur?fmtPrc(cur,h.ticker):fetching?"⟳":"-",color:C.text},
                {label:"수익률",val:pnlPct!=null?`${pnlPct>=0?"+":""}${pnlPct.toFixed(2)}%`:"-",color:pnlPct!=null?(pnlPct>=0?C.green:C.red):C.muted},
                {label:"신뢰도",val:a?.confidence??"-",color:sc||C.muted},
              ].map(({label,val,color})=>(
                <div key={label} style={{padding:"6px",borderRadius:7,textAlign:"center",
                  background:"rgba(255,255,255,0.02)",border:`1px solid ${C.border}`}}>
                  <div style={{color:C.muted,fontSize:8}}>{label}</div>
                  <div style={{color,fontSize:11,fontWeight:700}}>{val}</div>
                </div>
              ))}
            </div>

            {/* 기술적 지표 */}
            {a&&(
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:6,fontSize:9,color:C.muted}}>
                {a.rsi!=null&&(
                  <span>RSI <b style={{color:a.rsi>70?C.red:a.rsi<30?C.green:C.dim}}>{Math.round(a.rsi)}</b></span>
                )}
                {a.ma50!=null&&cur&&(
                  <span>MA50 <b style={{color:cur>a.ma50?C.green:C.red}}>{cur>a.ma50?"위 ▲":"아래 ▼"}</b></span>
                )}
                {a.target&&(
                  <span>목표 <b style={{color:C.cyan}}>{fmtPrc(a.target,h.ticker)}</b>
                    {a.target&&cur&&<span style={{color:C.muted}}> (+{((a.target/cur-1)*100).toFixed(1)}%)</span>}
                  </span>
                )}
                {a.stop&&(
                  <span>손절 <b style={{color:"#ef5350"}}>{fmtPrc(a.stop,h.ticker)}</b></span>
                )}
              </div>
            )}

            {/* DART 공시 */}
            {a?.dart_disclosures?.length>0&&(
              <div style={{marginTop:4,padding:"6px 8px",borderRadius:7,
                background:C.cyan+"0a",border:`1px solid ${C.cyan}22`}}>
                <div style={{color:C.cyan,fontSize:8,fontWeight:700,marginBottom:3}}>📢 최근 공시</div>
                {a.dart_disclosures.slice(0,2).map((dc,di)=>(
                  <div key={di} style={{color:C.dim,fontSize:9,lineHeight:1.5}}>
                    · {dc.title} <span style={{color:C.muted}}>{dc.date}</span>
                  </div>
                ))}
              </div>
            )}

            {/* DART 임원 매매 */}
            {a?.dart_insider&&(a.dart_insider.buy_count>0||a.dart_insider.sell_count>0)&&(
              <div style={{marginTop:5,padding:"5px 8px",borderRadius:7,
                background:"rgba(255,255,255,0.02)",border:`1px solid ${C.border}`}}>
                <span style={{fontSize:9,color:C.muted}}>👥 임원 매매 (60일) </span>
                {a.dart_insider.buy_count>0&&<span style={{fontSize:9,color:C.green,fontWeight:700}}>매수 {a.dart_insider.buy_count}건 </span>}
                {a.dart_insider.sell_count>0&&<span style={{fontSize:9,color:"#ef5350",fontWeight:700}}>매도 {a.dart_insider.sell_count}건</span>}
              </div>
            )}

            {/* KIS 수급 */}
            {a?.kis_data?.signal&&a.kis_data.signal!=="neutral"&&(
              <div style={{marginTop:5,padding:"5px 8px",borderRadius:7,
                background:"rgba(255,255,255,0.02)",border:`1px solid ${C.border}`,fontSize:9,color:C.muted}}>
                🏦 외국인 3일 <b style={{color:a.kis_data.frgn_3d>0?C.green:"#ef5350"}}>
                  {a.kis_data.frgn_3d>0?"+":""}{(a.kis_data.frgn_3d||0).toLocaleString()}주</b>
                {" / 기관 "}<b style={{color:a.kis_data.inst_3d>0?C.green:"#ef5350"}}>
                  {a.kis_data.inst_3d>0?"+":""}{(a.kis_data.inst_3d||0).toLocaleString()}주</b>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// 캘린더 페이지
// ════════════════════════════════════════════
function CalendarPage(){
  const [events,setEvents]=useState([]);
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    fetch(`${API_BASE}/api/calendar`)
      .then(r=>r.json())
      .then(d=>{setEvents(d.events||[]);setLoading(false);})
      .catch(()=>setLoading(false));
  },[]);

  const groups=useMemo(()=>{
    const m={};
    events.forEach(e=>{const d=e.date;if(!m[d])m[d]=[];m[d].push(e);});
    return m;
  },[events]);

  const impCol={high:C.red,medium:C.yellow,low:C.muted};
  const impLabel={high:"🔴 중요",medium:"🟡 보통",low:"⚪ 낮음"};

  return(
    <div className="tab-content">
      <div style={{color:C.text,fontSize:15,fontWeight:800,marginBottom:12}}>📅 경제지표 캘린더</div>
      {loading&&[0,1,2].map(i=>(
        <div key={i} style={{height:60,borderRadius:12,marginBottom:8,background:C.cardGradient,
          border:`1px solid ${C.border}`,animation:"pulse 2s infinite"}}/>
      ))}
      {Object.entries(groups).map(([date,evs])=>{
        const d=new Date(date);
        const today=new Date();today.setHours(0,0,0,0);
        const isToday=d.toDateString()===today.toDateString();
        const isTomorrow=d-today===86400000;
        const dow=["일","월","화","수","목","금","토"][d.getDay()];
        const label=isToday?"오늘":isTomorrow?"내일":null;
        return(
          <div key={date} style={{marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <div style={{color:isToday?C.cyan:C.muted,fontSize:12,fontWeight:700}}>
                {date.slice(5).replace("-","/")} ({dow})
              </div>
              {label&&<span style={{padding:"2px 7px",borderRadius:8,fontSize:9,fontWeight:700,
                color:isToday?C.cyan:C.yellow,background:`${isToday?C.cyan:C.yellow}18`,
                border:`1px solid ${isToday?C.cyan:C.yellow}33`}}>{label}</span>}
            </div>
            {evs.map((e,i)=>(
              <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",
                padding:"10px 12px",borderRadius:10,marginBottom:4,
                background:C.cardGradient,border:`1px solid ${impCol[e.importance]||C.border}22`,
                borderLeft:`3px solid ${impCol[e.importance]||C.muted}`}}>
                <span style={{fontSize:20,flexShrink:0}}>{e.country}</span>
                <div style={{flex:1}}>
                  <div style={{color:C.text,fontSize:12,fontWeight:700,marginBottom:2}}>{e.name}</div>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                    <span style={{color:C.muted,fontSize:10}}>{impLabel[e.importance]||e.importance}</span>
                    {e.forecast&&<span style={{color:C.dim,fontSize:10}}>예상 {e.forecast}</span>}
                    {e.previous&&<span style={{color:C.muted,fontSize:10}}>이전 {e.previous}</span>}
                  </div>
                </div>
              </div>
            ))}
          </div>
        );
      })}
      {!loading&&!events.length&&(
        <div style={{textAlign:"center",padding:40,color:C.muted,fontSize:13}}>
          이벤트가 없습니다
        </div>
      )}
    </div>
  );
}

function SettingsPage(){
  const LS_KEY="trading_bot_settings";
  const [cfg,setCfg]=useState(()=>{
    try{return JSON.parse(localStorage.getItem(LS_KEY)||'{}');}catch(e){return {};}
  });
  const save=(key,val)=>{
    const next={...cfg,[key]:val};
    setCfg(next);
    localStorage.setItem(LS_KEY,JSON.stringify(next));
  };
  const Toggle=({label,desc,settingKey})=>(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",
      padding:"12px 0",borderBottom:`1px solid ${C.border}33`}}>
      <div>
        <div style={{color:C.text,fontSize:13}}>{label}</div>
        <div style={{color:C.muted,fontSize:10,marginTop:2}}>{desc}</div>
      </div>
      <button onClick={()=>save(settingKey,!cfg[settingKey])} style={{
        width:42,height:24,borderRadius:12,border:"none",cursor:"pointer",
        background:cfg[settingKey]?C.green:"#374151",position:"relative",transition:"background .2s",flexShrink:0}}>
        <div style={{position:"absolute",top:3,left:cfg[settingKey]?20:3,width:18,height:18,
          borderRadius:"50%",background:"white",transition:"left .2s"}}/>

  return(
    <div className="tab-content">
      <div style={{color:C.text,fontSize:15,fontWeight:800,marginBottom:12}}>⚙️ 알림 설정</div>
      <div style={{padding:"12px 14px",borderRadius:12,background:C.cardGradient,border:`1px solid ${C.border}`,marginBottom:12}}>
        <div style={{color:C.dim,fontSize:10,fontWeight:700,letterSpacing:"0.06em",marginBottom:8}}>크로스 신호</div>
        <Toggle label="골든크로스 알림" desc="MA50이 MA200 상향 돌파 시 텔레그램 알림" settingKey="alertGolden"/>

      </div>
      <div style={{padding:"12px 14px",borderRadius:12,background:C.cardGradient,border:`1px solid ${C.border}`,marginBottom:12}}>
        <div style={{color:C.dim,fontSize:10,fontWeight:700,letterSpacing:"0.06em",marginBottom:8}}>RSI 극단값</div>
        <Toggle label="과매수 알림 (RSI>70)" desc="RSI 70 초과 시 텔레그램 알림" settingKey="alertRsiHigh"/>
        <Toggle label="과매도 알림 (RSI<30)" desc="RSI 30 미만 시 텔레그램 알림" settingKey="alertRsiLow"/>
      </div>
      <div style={{padding:"12px 14px",borderRadius:12,background:C.cardGradient,border:`1px solid ${C.border}`,marginBottom:12}}>
        <div style={{color:C.dim,fontSize:10,fontWeight:700,letterSpacing:"0.06em",marginBottom:8}}>시그널 변경</div>
        <Toggle label="레버리지 변경 알림" desc="2x↔1x↔현금 전환 시 알림" settingKey="alertLevChange"/>
        <Toggle label="현금 전환 알림" desc="현금 전환 시그널 발생 시 즉시 알림" settingKey="alertCash"/>
      </div>
      <div style={{padding:"12px 14px",borderRadius:12,background:C.surface,border:`1px solid ${C.border}`}}>
        <div style={{color:C.dim,fontSize:10,fontWeight:700,marginBottom:8}}>ℹ️ 서버 정보</div>
        <div style={{color:C.muted,fontSize:11,lineHeight:1.8}}>
          <div>서버: <span style={{color:C.cyan}}>{API_BASE}</span></div>
          <div>자동 업데이트: 5분마다 시그널 조회</div>
