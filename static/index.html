// 신호 적중률 트래킹 페이지
// ════════════════════════════════════════════
function TrackingPage(){
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);setErr(null);
    try{
      const r=await fetch(`${API_BASE}/api/signal_accuracy`);
      const j=await r.json();
      if(j.error) throw new Error(j.error);
      setData(j);
    }catch(e){setErr(e.message);}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{load();},[load]);

  const confColor=(acc)=>{
    if(acc==null) return C.muted;
    if(acc>=0.6) return C.green;
    if(acc>=0.4) return C.yellow;
    return C.red;
  };

  const sigColor=(st)=>{
    if(!st) return C.muted;
    if(st.includes("BUY")) return C.green;
    if(st.includes("SELL")) return C.red;
    return C.muted;
  };

  const verdictBadge=(v)=>{
    if(v==="correct") return <span style={{color:C.green,fontSize:10,fontWeight:700}}>✓ 적중</span>;
    if(v==="wrong")   return <span style={{color:C.red,  fontSize:10,fontWeight:700}}>✗ 실패</span>;
    return <span style={{color:C.muted,fontSize:10}}>— 중립</span>;
  };

  if(loading) return(
    <div className="tab-content">
      <div style={{color:C.dim,textAlign:"center",paddingTop:60}}>⟳ 데이터 로딩 중...</div>
    </div>
  );
  if(err) return(
    <div className="tab-content">
      <div style={{color:C.red,textAlign:"center",paddingTop:60,fontSize:13}}>{err}</div>
      <div style={{textAlign:"center",marginTop:12}}>
        <button onClick={load} style={{padding:"8px 20px",borderRadius:8,border:`1px solid ${C.cyan}44`,
          background:C.cyanBg,color:C.cyan,cursor:"pointer",fontSize:12}}>재시도</button>
      </div>
    </div>
  );
  if(!data) return null;

  const {by_type,by_band,recent,total,evaluated,pending,overall_acc,threshold_hint,last_evaluated}=data;

  return(
    <div className="tab-content">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{color:C.text,fontSize:15,fontWeight:800}}>📊 신호 적중률 트래킹</div>
        <button onClick={load} style={{padding:"5px 12px",borderRadius:8,
          border:`1px solid ${C.border}`,background:"transparent",
          color:C.dim,cursor:"pointer",fontSize:11}}>새로고침</button>
      </div>

      {/* 요약 카드 */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
        {[
          {label:"전체 신호",val:total,color:C.text},
          {label:"평가 완료",val:evaluated,color:C.cyan},
          {label:"평가 대기",val:pending,color:C.yellow},
          {label:"전체 적중률",val:overall_acc!=null?`${(overall_acc*100).toFixed(1)}%`:"—",
           color:overall_acc!=null?confColor(overall_acc):C.muted},
        ].map(item=>(
          <div key={item.label} style={{padding:"10px 8px",borderRadius:10,textAlign:"center",
            background:C.cardGradient,border:`1px solid ${C.border}`}}>
            <div style={{color:item.color,fontSize:16,fontWeight:800,fontVariantNumeric:"tabular-nums"}}>{item.val}</div>
            <div style={{color:C.muted,fontSize:9,marginTop:3}}>{item.label}</div>
          </div>
        ))}
      </div>

      {/* 임계값 권고 */}
      {threshold_hint&&(
        <div style={{padding:"10px 14px",borderRadius:10,marginBottom:14,
          background:threshold_hint.action==="raise"?C.redBg:C.greenBg,
          border:`1px solid ${threshold_hint.action==="raise"?C.red:C.green}44`}}>
          <div style={{color:threshold_hint.action==="raise"?C.red:C.green,fontSize:12,fontWeight:700}}>
            {threshold_hint.action==="raise"?"⚠️ 임계값 상향 권고":"✅ 신뢰도 임계값 양호"}
          </div>
          <div style={{color:C.dim,fontSize:11,marginTop:3}}>{threshold_hint.reason}</div>
          {threshold_hint.suggested&&(
            <div style={{color:C.muted,fontSize:10,marginTop:2}}>
              현재 {threshold_hint.current} → 권장 {threshold_hint.suggested}
            </div>
          )}
        </div>
      )}

      {/* 신호 유형별 적중률 */}
      {by_type&&Object.keys(by_type).length>0&&(
        <div style={{padding:"12px 14px",borderRadius:12,background:C.cardGradient,
          border:`1px solid ${C.border}`,marginBottom:14}}>
          <div style={{color:C.dim,fontSize:10,fontWeight:700,letterSpacing:"0.06em",marginBottom:10}}>
            신호 유형별 적중률
          </div>
          {Object.entries(by_type).map(([st,d])=>(
            <div key={st} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{color:sigColor(st),fontSize:12,fontWeight:700}}>{st}</span>
                <span style={{color:C.dim,fontSize:11}}>
                  {d.total}건 · 적중 {(d.accuracy*100).toFixed(0)}% · 평균 {d.avg_return>0?"+":""}{d.avg_return}%
                </span>
              </div>
              <div style={{height:6,borderRadius:3,background:C.border,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:3,
                  background:confColor(d.accuracy),
                  width:`${(d.accuracy*100).toFixed(0)}%`,transition:"width .4s"}}/>
              </div>
              <div style={{display:"flex",gap:10,marginTop:4}}>
                <span style={{color:C.green,fontSize:10}}>✓ {d.correct}</span>
                <span style={{color:C.red,fontSize:10}}>✗ {d.wrong}</span>
                <span style={{color:C.muted,fontSize:10}}>— {d.neutral}</span>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* 신뢰도 구간별 적중률 */}
      {by_band&&(
        <div style={{padding:"12px 14px",borderRadius:12,background:C.cardGradient,
          border:`1px solid ${C.border}`,marginBottom:14}}>
          <div style={{color:C.dim,fontSize:10,fontWeight:700,letterSpacing:"0.06em",marginBottom:10}}>
            신뢰도 구간별 적중률
          </div>
          <div style={{display:"grid",gridTemplateColumns:"auto 1fr auto auto",gap:"6px 10px",alignItems:"center"}}>
            {Object.entries(by_band).map(([band,d])=>(
              <React.Fragment key={band}>
                <span style={{color:C.muted,fontSize:11,fontVariantNumeric:"tabular-nums"}}>{band}</span>
                <div style={{height:8,borderRadius:4,background:C.border,overflow:"hidden"}}>
                  <div style={{height:"100%",borderRadius:4,
                    background:d.accuracy!=null?confColor(d.accuracy):C.muted,
                    width:d.accuracy!=null?`${(d.accuracy*100).toFixed(0)}%`:"0%",transition:"width .4s"}}/>
                </div>
                <span style={{color:d.accuracy!=null?confColor(d.accuracy):C.muted,fontSize:11,fontWeight:700,
                  fontVariantNumeric:"tabular-nums",textAlign:"right"}}>
                  {d.accuracy!=null?`${(d.accuracy*100).toFixed(0)}%`:"—"}
                </span>
                <span style={{color:C.muted,fontSize:10,textAlign:"right"}}>({d.total}건)</span>
              </React.Fragment>
            ))}
          </div>
          <div style={{color:C.muted,fontSize:10,marginTop:8}}>
            * 5거래일 후 ±2% 기준 (correct/wrong/neutral)
          </div>
        </div>
      )}

      {/* 최근 신호 20개 */}
      {recent&&recent.length>0&&(
        <div style={{padding:"12px 14px",borderRadius:12,background:C.cardGradient,
          border:`1px solid ${C.border}`}}>
          <div style={{color:C.dim,fontSize:10,fontWeight:700,letterSpacing:"0.06em",marginBottom:10}}>
            최근 신호 이력 (최대 20개)
          </div>
          {recent.map((s,i)=>{
            const oc=s.outcome;
            return(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,
                padding:"7px 0",borderBottom:i<recent.length-1?`1px solid ${C.border}33`:"none"}}>
                <span style={{color:sigColor(s.signal_type),fontSize:10,fontWeight:700,width:72,flexShrink:0}}>{s.signal_type}</span>
                <div style={{flex:1,minWidth:0,overflow:"hidden"}}>
                  <div style={{color:C.text,fontSize:11,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name&&s.name!==s.ticker?s.name:s.ticker}</div>
                  {s.name&&s.name!==s.ticker&&<div style={{color:C.muted,fontSize:9,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.ticker}</div>}
                </div>
                <span style={{color:C.muted,fontSize:10,flexShrink:0}}>{s.confidence}%</span>
                <span style={{color:C.dim,fontSize:10,flexShrink:0,minWidth:72,textAlign:"right"}}>
                  {s.timestamp?s.timestamp.slice(0,10):"—"}
                </span>
                <span style={{width:60,textAlign:"right",flexShrink:0}}>
                  {oc?verdictBadge(oc.verdict):<span style={{color:C.muted,fontSize:10}}>대기</span>}
                </span>
                {oc&&<span style={{color:oc.return_pct>=0?C.green:C.red,fontSize:10,fontWeight:700,
                  fontVariantNumeric:"tabular-nums",width:50,textAlign:"right",flexShrink:0}}>
                  {oc.return_pct>=0?"+":""}{oc.return_pct}%
                </span>}
              </div>
            );
          })}
        </div>
      )}

      {evaluated===0&&(
        <div style={{textAlign:"center",padding:"40px 20px",color:C.muted,fontSize:13}}>
          아직 평가된 신호가 없습니다.<br/>
          <span style={{fontSize:11,marginTop:8,display:"block",color:C.dim}}>
            종목 분석 시 BUY/SELL 신호가 자동 기록되며,<br/>7일 후부터 결과가 평가됩니다.
          </span>
        </div>
      )}

      {last_evaluated&&(
        <div style={{color:C.muted,fontSize:10,textAlign:"right",marginTop:10}}>
          마지막 평가: {last_evaluated.slice(0,16)}
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════
// 마켓 탭 콘텐츠
// ════════════════════════════════════════════
function MarketTab({markets,onChart,data,fetchSignals,runAnalysis,loading,apiConnected,clock}){
  const [openMap,setOpenMap]=useState({"^KS11":true});
  const [sigFilter,setSigFilter]=useState("all");
  const [openSec,setOpenSec]=useState({lev:true,dual:true,risk:false,crypto:true});
  const [searchResult,setSearchResult]=useState(null);

  const toggle=(t)=>setOpenMap(p=>({...p,[t]:!p[t]}));
  const toggleSec=(k)=>setOpenSec(p=>({...p,[k]:!p[k]}));

  const STRAT_GROUPS=useMemo(()=>[
    {
      key:"lev", color:C.green,
      label:"⚡ 레버리지 스위칭",
      desc:"MA200 추세 + ADX 강도로 2x ETF → 1x 원물 → 현금 자동 전환. 트렌딩 시장·유동성 충분한 2x 상품 보유 시장.",
      note:"🇰🇷한국 · 🇺🇸미국 · 🇯🇵일본 · 🇭🇰홍콩 · 🇨🇳중국 · 🇮🇳인도 · 🇹🇼대만 · 🇩🇪DAX · 🇪🇺STOXX · 🇦🇺호주 · 🇧🇷브라질",
      ms: markets.filter(m=>m.strategy==="leverage"&&!m.ticker?.includes("-USD")),
    },
    {
      key:"dual", color:"#a855f7",
      label:"📊 이중 모멘텀 필터",
      desc:"3개월·10개월 모멘텀 동시 양전환 시 진입. 레버리지 ETF가 없거나 정치·환율 변수가 큰 신흥국 시장.",
      note:"🇸🇬싱가포르 · 🇮🇩인도네시아 · 🇲🇾말레이시아 · 🇲🇽멕시코 · 🇵🇱폴란드 · 🇹🇷터키 · 🇿🇦남아공 · 🇹🇭태국 · 🇵🇭필리핀 · 🇦🇷아르헨티나",
      ms: markets.filter(m=>m.strategy==="dual_filter"),
    },
    {
      key:"risk", color:C.yellow,
      label:"🛡️ 위기방어형",
      desc:"MA·RSI·변동성 종합 위험스코어(0~100). 낮은 성장·고배당·방어적 유럽 시장. 2x ETF 유동성 부족.",
      note:"🇬🇧영국 · 🇫🇷프랑스 · 🇨🇭스위스 · 🇪🇸스페인 · 🇮🇹이탈리아 · 🇳🇱네덜란드 · 🇸🇪스웨덴 · 🇳🇴노르웨이 · 🇦🇹오스트리아 · 🇳🇿뉴질랜드 · 🇮🇱이스라엘 · 🇸🇦사우디",
      ms: markets.filter(m=>m.strategy==="risk_defense"),
    },
    {
      key:"crypto", color:C.cyan,
      label:"₿ 크립토",
      desc:"₿BTC 레버리지 스위칭(2x/1x/현금) + 알트코인 미너비니 타이트 추세추종. 24h 고변동성 자산.",
      note:"₿BTC · Ξ ETH · ◎SOL · ✕XRP · 🟡BNB · 🐕DOGE · 🔵ADA · 🔺AVAX",
      ms: markets.filter(m=>m.ticker?.includes("-USD")),
    },
  ],[markets]);

  const buys=markets.filter(m=>["BUY","LEVERAGE_2X","INVESTED","STRONG_BUY"].includes(m.signal_type)).length;
  const sells=markets.filter(m=>["SELL","CASH","CASH_VOL","STRONG_SELL"].includes(m.signal_type)).length;

  return(
    <div className="tab-content">
      {/* 헤더 */}
      <div style={{textAlign:"center",marginBottom:10}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:"0.18em",textTransform:"uppercase",marginBottom:3,
          background:`linear-gradient(90deg,${C.cyan},${C.green})`,
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text"}}>
          MULTI-MARKET TRADING BOT v4.0
        </div>
        <div style={{color:C.muted,fontSize:10,display:"flex",justifyContent:"center",gap:6,flexWrap:"wrap"}}>
          <span>{clock.toLocaleString("ko-KR")}</span>
          {apiConnected
            ?<span style={{color:C.green,display:"flex",alignItems:"center",gap:3}}>
                <span style={{animation:"dotPulse 2s infinite",display:"inline-block"}}>●</span> 서버연결
              </span>
            :<span style={{color:C.yellow}}>● 데모</span>}
        </div>
        {data?.generated_at&&(()=>{
          const diff=Math.floor((Date.now()-new Date(data.generated_at))/60000);
          const ago=diff<1?"방금":diff<60?`${diff}분 전`:`${Math.floor(diff/60)}시간 전`;
          return <div style={{color:C.muted,fontSize:9,textAlign:"center",marginTop:1}}>
            ⏱ 분석: {ago}
          </div>;
        })()}
      </div>

      {/* 🔍 종목 검색 (최상단) */}
      <TopSearchBar onResult={setSearchResult}/>
      {searchResult&&searchResult.type==="stock"&&(
        <StockResultCard data={searchResult.data} onChart={onChart} onClose={()=>setSearchResult(null)}/>
      )}
      {searchResult&&searchResult.type==="error"&&(
        <div style={{padding:"10px 14px",borderRadius:10,background:C.redBg,color:C.red,
          fontSize:12,marginBottom:8,border:`1px solid ${C.red}22`,display:"flex",justifyContent:"space-between"}}>
          ⚠️ {searchResult.msg}
          <button onClick={()=>setSearchResult(null)} style={{background:"none",border:"none",color:C.red,cursor:"pointer"}}>✕</button>
        </div>
      )}

      {/* 🌍 매크로 환경 (VIX · 금리커브 · DXY) */}
      <MacroPanel markets={markets}/>

      {/* 공포탐욕 + 환율 (데스크탑: 2컬럼) */}
      <div className="desktop-grid" style={{marginBottom:0}}>
        <div><FearGreedWidget/></div>
        <div><ForexBoard/></div>
      </div>

      {/* 글로벌 마켓 세계지도 */}
      <WorldMap markets={markets}/>

      {/* 섹터 히트맵 */}
      <SectorHeatmap/>

      {/* 신호 히스토리 */}
      <SignalHistory/>

      {/* 액션 + 요약 (데스크탑: 2컬럼) */}
      <div className="desktop-grid" style={{marginBottom:0}}>
        <div>
          {/* 액션 버튼 */}
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <button onClick={fetchSignals} disabled={loading} style={{
              flex:1,padding:"10px",borderRadius:11,border:`1px solid ${C.cyan}44`,background:C.cyan+"12",
              color:C.cyan,fontSize:12,fontWeight:700,cursor:"pointer",
              display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              {loading?<span style={{animation:"spin .7s linear infinite",display:"inline-block"}}>⟳</span>:"🔄"}
              {loading?"로딩 중...":"시그널 새로고침"}
            </button>
            <button onClick={runAnalysis} disabled={loading} style={{
              flex:1,padding:"10px",borderRadius:11,border:`1px solid ${C.green}44`,background:C.green+"12",
              color:C.green,fontSize:12,fontWeight:700,cursor:"pointer",
              display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              ▶ 분석 실행
            </button>
          </div>
        </div>
        <div>
          {/* 요약 */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
            {[["🟢",buys,"매수"],["🔴",sells,"매도"],["⚪",markets.length-buys-sells,"중립"]].map(([ic,n,lb])=>(
              <div key={lb} style={{padding:"10px",borderRadius:10,textAlign:"center",
                background:C.cardGradient,border:`1px solid ${C.border}`}}>
                <div style={{fontSize:18,marginBottom:2}}>{ic}</div>
                <div style={{color:C.text,fontSize:20,fontWeight:900}}>{n}</div>
                <div style={{color:C.muted,fontSize:9}}>{lb}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* 시그널 필터 */}
      <div style={{display:"flex",gap:6,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
        {[["all","전체"],["buy","매수"],["sell","매도"],["hold","중립"]].map(([v,l])=>(
          <button key={v} onClick={()=>setSigFilter(v)} style={{
            flexShrink:0,padding:"6px 14px",borderRadius:10,fontSize:11,fontWeight:700,cursor:"pointer",
            border:`1px solid ${sigFilter===v?C.cyan+"55":C.border}`,
            background:sigFilter===v?C.cyan+"18":"transparent",
            color:sigFilter===v?C.cyan:C.muted}}>
            {l}
          </button>
        ))}
      </div>

      {/* 전략별 섹션 */}
      {STRAT_GROUPS.map(({key,label,desc,note,color,ms})=>{
        const vis=sigFilter==="all"?ms
          :sigFilter==="buy"?ms.filter(m=>["BUY","LEVERAGE_2X","INVESTED","STRONG_BUY"].includes(m.signal_type))
          :sigFilter==="sell"?ms.filter(m=>["SELL","CASH","CASH_VOL","STRONG_SELL"].includes(m.signal_type))
          :ms.filter(m=>["HOLD_1X","NEUTRAL","CAUTION"].includes(m.signal_type));
        if(vis.length===0) return null;
        const gb=vis.filter(m=>["BUY","LEVERAGE_2X","INVESTED","STRONG_BUY"].includes(m.signal_type)).length;
        const gs=vis.filter(m=>["SELL","CASH","CASH_VOL","STRONG_SELL"].includes(m.signal_type)).length;
        const isOpen=openSec[key];
        return(
          <div key={key} style={{marginBottom:16}}>
            <div onClick={()=>toggleSec(key)} style={{
              padding:"11px 14px",borderRadius:12,cursor:"pointer",
              background:`${color}09`,border:`1px solid ${color}28`,
              borderLeft:`3px solid ${color}`,marginBottom:isOpen?8:0,
              transition:"margin .2s"}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                <span style={{color,fontSize:12,fontWeight:800}}>{label}</span>
                <span style={{color:C.muted,fontSize:9}}>({vis.length})</span>
                <span style={{marginLeft:2,color:C.green,fontSize:9,fontWeight:700}}>🟢{gb}</span>
                <span style={{color:C.red,fontSize:9,fontWeight:700}}>🔴{gs}</span>
                <span style={{marginLeft:"auto",color:C.muted,fontSize:11}}>{isOpen?"▲":"▼"}</span>
              </div>
              <div style={{color:C.muted,fontSize:9,lineHeight:1.5}}>{desc}</div>
              {isOpen&&<div style={{color:`${color}99`,fontSize:8,marginTop:4,lineHeight:1.6}}>{note}</div>}
            </div>
            {isOpen&&(
              <div className="desktop-grid">
                {vis.map(m=><Card key={m.ticker} m={m} open={!!openMap[m.ticker]}
                  onToggle={()=>toggle(m.ticker)} onChart={onChart}/>)}
              </div>
            )}
          </div>
        );
      })}

      {/* 푸터 */}
      <div style={{marginTop:16,padding:"12px 14px",borderRadius:12,
        background:C.surface,borderTop:`1px solid ${C.border}`,textAlign:"center"}}>
        <div style={{color:C.muted,fontSize:10,marginBottom:4}}>
          ⏰ 자동 분석: 매일 <span style={{color:C.cyan}}>08:00</span> / <span style={{color:C.cyan}}>16:00</span> KST · 신호 변경 시 텔레그램 알림
        </div>
        <div style={{color:C.muted,fontSize:10}}>
          5년 실데이터 백테스트 · 20개+ 지수 + 개별주 · 4개 전략
        </div>
        <div style={{fontSize:9,color:C.muted,opacity:.5,marginTop:4}}>
          ⚠️ 투자 판단의 참고자료이며, 손실 책임은 본인에게 있습니다
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════
// 메인 앱
// ════════════════════════════════════════════
function App(){
  const [data,setData]=useState(DEMO_DATA);
  const [tab,setTab]=useState("market");
  const [loading,setLoading]=useState(false);
  const [apiConnected,setApiConnected]=useState(false);
  const [clock,setClock]=useState(new Date());
  const [chartMarket,setChartMarket]=useState(null);

  useEffect(()=>{
    const t=setInterval(()=>setClock(new Date()),1000);
    return()=>clearInterval(t);
  },[]);

  const fetchSignals=useCallback(async()=>{
    setLoading(true);
    try{
      const r=await fetch(`${API_BASE}/api/signals`);
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const j=await r.json();
      if(j.markets){setData(j);setApiConnected(true);}
    }catch(e){
      console.log("API 연결 실패, 데모 데이터 사용:",e.message);
      setApiConnected(false);
    }finally{setLoading(false);}
  },[]);

  const runAnalysis=async()=>{
    setLoading(true);
    try{
      const r=await fetch(`${API_BASE}/api/run`);
      const j=await r.json();
      if(j.data?.markets){setData(j.data);setApiConnected(true);}
    }catch(e){}
    finally{setLoading(false);}
  };

  useEffect(()=>{
    fetchSignals();
    const iv=setInterval(fetchSignals,5*60*1000);
    return()=>clearInterval(iv);
  },[fetchSignals]);

  const markets=data.markets||[];

  return(
    <div className="main-wrap" style={{minHeight:"100vh",background:C.bg,color:C.text,
      fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"}}>
      <GlobalStyles/>
      {/* 배경 글로우 */}
      <div style={{position:"fixed",top:-120,left:"20%",width:460,height:460,borderRadius:"50%",
        background:`radial-gradient(circle,${C.green}07 0%,transparent 70%)`,pointerEvents:"none",zIndex:0}}/>
      <div style={{position:"fixed",bottom:-100,right:"10%",width:300,height:300,borderRadius:"50%",
        background:`radial-gradient(circle,${C.cyan}06 0%,transparent 70%)`,pointerEvents:"none",zIndex:0}}/>

      <div className="app-wrap">
        {tab==="market"&&<MarketTab markets={markets} onChart={setChartMarket}
          data={data} fetchSignals={fetchSignals} runAnalysis={runAnalysis}
          loading={loading} apiConnected={apiConnected} clock={clock}/>}
        {tab==="screener"&&<ScreenerPage markets={markets} onChart={setChartMarket}/>}
        {tab==="ranking"&&<RankingPage/>}
        {tab==="portfolio"&&<PortfolioPage/>}
        {tab==="calendar"&&<CalendarPage/>}
        {tab==="tracking"&&<TrackingPage/>}
        {tab==="settings"&&<SettingsPage/>}
      </div>

      <SideNav tab={tab} setTab={setTab}/>
      <BottomTabBar tab={tab} setTab={setTab}/>
      {chartMarket&&<ChartModal market={chartMarket} onClose={()=>setChartMarket(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
